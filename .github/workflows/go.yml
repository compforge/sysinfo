name: Go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make lint test build
      - name: Run without root and verify JSON
        run: |
          case "$(uname -m)" in aarch64|arm64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          case "$(uname -s)" in Linux) platform=linux ;; Darwin) platform=darwin ;; esac
          version=$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' version.go)
          ./dist/sysinfo-$version-$platform-$arch > /tmp/sysinfo.json
          python3 - <<'PYTHON'
          import json, os, sys
          with open('/tmp/sysinfo.json') as f:
              report = json.load(f)
          assert report['runtime']['page_size_bytes'] == os.sysconf('SC_PAGE_SIZE')
          assert report['runtime']['resource_limits']
          if sys.platform == 'linux':
              assert report['runtime']['libc']
              assert report['runtime']['vm']['overcommit_memory'] in ['0', '1', '2']
          else:
              assert report['os']['name'] == 'macOS'
              assert report['os']['version']
              assert report['kernel']['release']
              assert report['memory']['size'] > 0
          PYTHON
